name: Release Build

# Two doors into the same release: a dispatch that builds and publishes, and
# the `published` event that catches a draft promoted by a human later. A draft
# release is not a release and never reaches the downloads worker.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      worker_targets:
        description: 'Worker targets as a JSON array'
        required: false
        default: '["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu"]'
        type: string
      channel:
        description: 'Update channel written to channel_versions.json'
        required: false
        default: 'stable'
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean
      allow_unsigned:
        description: 'Build unsigned (test builds only; a real release must be signed)'
        required: false
        default: false
        type: boolean
      epoch:
        description: 'Manifest epoch written to channel_versions.json (rises on every publish)'
        required: false
        default: '1'
        type: string
      yanked:
        description: 'Comma-separated withdrawn versions, sorted (e.g. 0.1.9,0.2.0)'
        required: false
        default: ''
        type: string
      download_base_url:
        description: 'Base URL for manifest artifact links (default: the GitHub release)'
        required: false
        default: ''
        type: string
  release:
    types: [published]

# Minimal by default; only the job that creates the GitHub release asks for
# `contents: write`. Downloading/uploading workflow artifacts does not.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-worker:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The input is a JSON array, and `||` supplies the default when a
        # dispatch omits it. A comma-separated string here would make `fromJson`
        # fail to parse the matrix, and a job with no matrix entries is never
        # created: every job that needs the worker then quietly skips, as
        # publish-release did.
        target: ${{ fromJson(inputs.worker_targets || '["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # vendor/alacritty_terminal is a path dependency of goble-terminal, and a
      # missing path dependency fails every cargo command in this workspace, not
      # just the terminal's. Restore it before anything builds; the script pins
      # the archive by SHA-256.
      - name: Restore the vendored terminal emulator
        if: ${{ !hashFiles('vendor/alacritty_terminal/Cargo.toml') }}
        shell: bash
        run: ./scripts/fetch-alacritty-terminal.sh --install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install cross compile dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build worker
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p goblin-worker --release --target ${{ matrix.target }}

      - name: Package worker
        run: |
          mkdir -p dist
          ARCH_NAME=$(echo "${{ matrix.target }}" | tr '-' '_')
          tar -czf "dist/goblin-worker-${ARCH_NAME}.tar.gz" \
            -C "target/${{ matrix.target }}/release" \
            goblin \
            -C "$GITHUB_WORKSPACE" \
            scripts/install-goblin.sh

      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: goblin-worker-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Native desktop app (goble-app). Each runner builds for its own target and
  # runs the matching packaging script, then uploads the installers plus a
  # per-platform SHA256SUMS.
  # ---------------------------------------------------------------------------
  build-app:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: app / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macOS aarch64
            platform: macos
            arch: arm64
          # macos-14 is arm64 hardware; cross-building the x86_64 slice there is
          # fine. Swap to macos-13 if a native Intel runner is ever required.
          - os: macos-14
            target: x86_64-apple-darwin
            label: macOS x86_64
            platform: macos
            arch: x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64
            platform: linux
            arch: x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: Windows x86_64
            platform: windows
            arch: x64
    env:
      # `secrets` cannot be read in a step's `if`, so the certificate's presence
      # is hoisted here as a flag and the import step tests that instead.
      APPLE_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      # Where an installed build looks for updates and which key it trusts.
      # Both values are public, so they are baked in here: an install must not
      # depend on the runner having a repository variable set. The key is the
      # public half of GOBLE_UPDATE_SIGNING_KEY, printed by
      # `packaging/sign-manifest.sh --print-pubkey`; a manifest whose signature
      # does not verify against it is refused.
      GOBLE_UPDATE_MANIFEST: https://get.octomus.dev/channel_versions.json
      GOBLE_UPDATE_PUBLIC_KEY: d049abf5e7b5bc1f9068a7eb804066defbdfdf10185b5e4ab584dda89f51ad76
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # vendor/alacritty_terminal is a path dependency of goble-terminal, and a
      # missing path dependency fails every cargo command in this workspace, not
      # just the terminal's. Restore it before anything builds; the script pins
      # the archive by SHA-256.
      - name: Restore the vendored terminal emulator
        if: ${{ !hashFiles('vendor/alacritty_terminal/Cargo.toml') }}
        shell: bash
        run: ./scripts/fetch-alacritty-terminal.sh --install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Resolve version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          echo "GOBLE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # --- Linux build prerequisites -----------------------------------------
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev libfreetype-dev \
            file wget libfuse2

      - name: Install appimagetool
        if: matrix.platform == 'linux'
        run: |
          sudo wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          # GitHub runners have no FUSE device; make appimagetool extract itself.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Build app and control binaries
        # The whole shipping set goes together: the app, the attachable PTY
        # daemon (the binary target owned by the goble-pty package), the
        # control CLI, and the MCP server. `-p goble-pty` selects the package
        # that produces goble-pty-daemon.
        # Baked in with `option_env!`: the channel decides whether the build
        # reports crashes and accepts updates, and the version is what a crash
        # report and an update check compare against.
        # PowerShell is the default shell on the Windows runners, and it does
        # not continue a command over a trailing backslash: `-p` on the next
        # line becomes a separate command. The step is bash on every platform.
        shell: bash
        env:
          GOBLE_CHANNEL: ${{ inputs.channel }}
          GOBLE_RELEASE_VERSION: ${{ env.GOBLE_VERSION }}
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p goble-app -p goble-pty -p goble-cli -p goble-mcp

      # --- macOS --------------------------------------------------------------
      - name: Import Apple signing certificate
        if: matrix.platform == 'macos' && env.APPLE_SIGNING_CONFIGURED == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/goble-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Assemble .app and .dmg
        if: matrix.platform == 'macos'
        env:
          # Only advertise an identity when the certificate was imported above.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # A release is signed; without the secrets above this fails here
          # rather than publishing a download Gatekeeper refuses.
          GOBLE_REQUIRE_SIGNING: ${{ !inputs.allow_unsigned && '1' || '0' }}
        run: |
          TARGET_DIR="target/${{ matrix.target }}/release"
          packaging/macos/make-bundle.sh \
            --binary "$TARGET_DIR/goble-app" \
            --pty-daemon-binary "$TARGET_DIR/goble-pty-daemon" \
            --cli-binary "$TARGET_DIR/goble-cli" \
            --mcp-binary "$TARGET_DIR/goble-mcp" \
            --outdir dist --version "$GOBLE_VERSION" --arch ${{ matrix.arch }}
          packaging/macos/make-dmg.sh \
            --app "dist/Goble.app" --outdir dist \
            --version "$GOBLE_VERSION" --arch ${{ matrix.arch }}

      - name: Delete signing keychain
        if: always() && matrix.platform == 'macos'
        run: |
          security delete-keychain "$RUNNER_TEMP/goble-signing.keychain-db" 2>/dev/null || true

      # --- Linux --------------------------------------------------------------
      - name: Build AppImage
        if: matrix.platform == 'linux'
        run: |
          TARGET_DIR="target/${{ matrix.target }}/release"
          packaging/linux/make-appimage.sh \
            --binary "$TARGET_DIR/goble-app" \
            --pty-daemon-binary "$TARGET_DIR/goble-pty-daemon" \
            --cli-binary "$TARGET_DIR/goble-cli" \
            --mcp-binary "$TARGET_DIR/goble-mcp" \
            --outdir dist --version "$GOBLE_VERSION" --arch x86_64

      - name: Build .deb and .tar.gz
        if: matrix.platform == 'linux'
        run: |
          TARGET_DIR="target/${{ matrix.target }}/release"
          packaging/linux/make-deb.sh \
            --binary "$TARGET_DIR/goble-app" \
            --pty-daemon-binary "$TARGET_DIR/goble-pty-daemon" \
            --cli-binary "$TARGET_DIR/goble-cli" \
            --mcp-binary "$TARGET_DIR/goble-mcp" \
            --outdir dist --version "$GOBLE_VERSION" --arch amd64
          packaging/linux/make-tarball.sh \
            --binary "$TARGET_DIR/goble-app" \
            --pty-daemon-binary "$TARGET_DIR/goble-pty-daemon" \
            --cli-binary "$TARGET_DIR/goble-cli" \
            --mcp-binary "$TARGET_DIR/goble-mcp" \
            --outdir dist --version "$GOBLE_VERSION" --arch x86_64

      # --- Windows ------------------------------------------------------------
      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        # The runner image ships a newer Inno Setup, and `choco install` refuses
        # to downgrade it. Use whatever ISCC.exe is already there; install one
        # only when the image has none.
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_PFX: ${{ secrets.WINDOWS_SIGN_CERT_PFX }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
          WINDOWS_SIGN_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_CERT_THUMBPRINT }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
          # A release is signed; without a certificate this fails here rather
          # than publishing an installer SmartScreen flags.
          GOBLE_REQUIRE_SIGNING: ${{ !inputs.allow_unsigned && '1' || '0' }}
        run: |
          $targetDir = "target/${{ matrix.target }}/release"
          ./packaging/windows/build-installer.ps1 `
            -Version "$env:GOBLE_VERSION" `
            -SourceBinary "$targetDir/goble-app.exe" `
            -PtyDaemonBinary "$targetDir/goble-pty-daemon.exe" `
            -CliBinary "$targetDir/goble-cli.exe" `
            -McpBinary "$targetDir/goble-mcp.exe" `
            -OutDir dist -Arch x64

      # --- checksums + upload -------------------------------------------------
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          scripts/release.sh --skip-build --skip-package \
            --version "$GOBLE_VERSION" --outdir dist

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goble-app-${{ matrix.target }}
          # Explicit list: dist/* would also pull in the intermediate Goble.app
          # directory, which is not a shippable artifact and would collide when
          # the per-OS artifacts are merged.
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Merge every platform's artifacts, write the aggregate SHA256SUMS and the
  # updater manifest, and sign the manifest when the key is configured.
  # ---------------------------------------------------------------------------
  app-manifest:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: app / manifest
    runs-on: ubuntu-22.04
    needs: build-app
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          echo "GOBLE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download app artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: goble-app-*
          merge-multiple: true
          path: dist

      - name: List collected artifacts
        run: ls -lh dist

      - name: Write SHA256SUMS and channel manifest
        env:
          GOBLE_UPDATE_SIGNING_KEY: ${{ secrets.GOBLE_UPDATE_SIGNING_KEY }}
          # The manifest signature is what authenticates every platform's
          # artifact — including Linux, which has no artifact signature of its
          # own — so a release must not ship one unsigned.
          GOBLE_REQUIRE_SIGNING: ${{ !inputs.allow_unsigned && '1' || '0' }}
          # The epoch rises on every publish, so an install can tell an
          # authoritative withdrawal from a stale manifest.
          GOBLE_RELEASE_EPOCH: ${{ inputs.epoch }}
          GOBLE_YANKED_VERSIONS: ${{ inputs.yanked }}
          # Links point at the downloads worker when it is configured, so
          # moving the domain is a manifest republish, not a client change.
          GOBLE_DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
        run: |
          scripts/release.sh --skip-build --skip-package --manifest \
            --version "$GOBLE_VERSION" \
            --channel "${{ inputs.channel }}" \
            --outdir dist

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: goble-app-manifest
          path: |
            dist/SHA256SUMS
            dist/channel_versions.json
            dist/*.sig
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: [build-worker, build-app, app-manifest]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # vendor/alacritty_terminal is a path dependency of goble-terminal, and a
      # missing path dependency fails every cargo command in this workspace, not
      # just the terminal's. Restore it before anything builds; the script pins
      # the archive by SHA-256.
      - name: Restore the vendored terminal emulator
        if: ${{ !hashFiles('vendor/alacritty_terminal/Cargo.toml') }}
        shell: bash
        run: ./scripts/fetch-alacritty-terminal.sh --install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Verify workspace
        run: |
          ./scripts/fmt.sh --check
          cargo check --workspace --all-targets
          cargo test --workspace

      - name: Download worker artifacts
        uses: actions/download-artifact@v4
        with:
          path: worker-artifacts
          pattern: goblin-worker-*

      - name: Download app artifacts
        uses: actions/download-artifact@v4
        with:
          path: app-artifacts
          pattern: goble-app-*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=""
          for f in worker-artifacts/*/*.tar.gz; do
            FILES="$FILES $f"
          done
          for f in app-artifacts/*/*; do
            [ -f "$f" ] || continue
            # Every build-app job uploads its own SHA256SUMS; only the aggregate
            # one from app-manifest belongs on the release, otherwise the upload
            # collides on duplicate asset names.
            case "$f" in
              */SHA256SUMS)
                [ "$(basename "$(dirname "$f")")" = "goble-app-manifest" ] || continue
                ;;
            esac
            FILES="$FILES $f"
          done
          gh release create "${{ inputs.tag }}" \
            --title "Goble ${{ inputs.tag }}" \
            --generate-notes \
            ${{ inputs.draft && '--draft' || '' }} \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            $FILES

      # A draft has not been published, so it must not reach the downloads
      # worker: nobody can install what is still a draft. Publishing the draft
      # later fires the `release: published` job below instead.
      - name: Publish the signed manifest to the downloads worker
        if: ${{ !inputs.draft }}
        env:
          GOBLE_WORKER_URL: ${{ secrets.GOBLE_WORKER_URL }}
          GOBLE_WORKER_ADMIN_TOKEN: ${{ secrets.GOBLE_WORKER_ADMIN_TOKEN }}
        run: |
          scripts/publish-manifest.sh \
            --manifest app-artifacts/goble-app-manifest/channel_versions.json \
            --channel "${{ inputs.channel }}"

  # ---------------------------------------------------------------------------
  # A draft promoted to a published release. The manifest is attached to the
  # release, so this job reads it back rather than rebuilding anything, and
  # posts it unchanged: the signature covers the bytes, so re-signing here would
  # hide a mismatch instead of reporting one.
  # ---------------------------------------------------------------------------
  publish-manifest:
    name: downloads worker
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the signed manifest from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern channel_versions.json --dir dist

      - name: Publish it to the downloads worker
        env:
          GOBLE_WORKER_URL: ${{ secrets.GOBLE_WORKER_URL }}
          GOBLE_WORKER_ADMIN_TOKEN: ${{ secrets.GOBLE_WORKER_ADMIN_TOKEN }}
        run: scripts/publish-manifest.sh --manifest dist/channel_versions.json
