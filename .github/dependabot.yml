# Dependency updates. Monthly: Goble ships on its own release cadence, so a
# weekly drip of dependency pull requests cost more review than it saved.
#
# Patch and minor bumps for one ecosystem arrive as a single grouped pull
# request. A major bump keeps its own request and carries the
# `dependencies-major` label, because it needs migration notes rather than a
# green tick. At most two requests are open per ecosystem at a time; anything
# beyond that waits for the next run instead of piling up.
#
# Security fixes do not wait for this schedule: they arrive the moment an
# advisory lands, through Dependabot alerts and Dependabot security updates.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      rust-major:
        patterns: ["*"]
        update-types: ["major"]
        labels:
          - dependencies
          - dependencies-major
    ignore:
      # The vendored emulator is pinned by scripts/fetch-alacritty-terminal.sh,
      # not by the crates.io graph.
      - dependency-name: alacritty_terminal

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
        labels:
          - dependencies
          - dependencies-major
