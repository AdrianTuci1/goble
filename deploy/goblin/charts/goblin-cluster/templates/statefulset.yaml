apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "goblin-cluster.fullname" . }}
  labels:
    {{- include "goblin-cluster.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "goblin-cluster.fullname" . }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "goblin-cluster.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "goblin-cluster.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "goblin-cluster.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: goblin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: GOBLIN_MODE
              value: "cluster"
            - name: GOBLIN_BIND
              value: "0.0.0.0:8787"
            - name: GOBLIN_PVC_ROOT
              value: "/var/goblin"
            - name: GOBLIN_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GOBLIN_LEASE_NAME
              value: {{ .Values.leaseName | quote }}
            {{- if .Values.clusterKey }}
            - name: GOBLIN_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "goblin-cluster.fullname" . }}-cluster-key
                  key: cluster-key
            {{- end }}
            {{- if .Values.snapshot.enabled }}
            - name: GOBLIN_SNAPSHOT_DIR
              value: "/var/goblin/snapshots"
            - name: GOBLIN_SNAPSHOT_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: {{ include "goblin-cluster.fullname" . }}-snapshot
                  key: provider
            - name: GOBLIN_SNAPSHOT_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "goblin-cluster.fullname" . }}-snapshot
                  key: endpoint
            - name: GOBLIN_SNAPSHOT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ include "goblin-cluster.fullname" . }}-snapshot
                  key: bucket
            - name: GOBLIN_SNAPSHOT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "goblin-cluster.fullname" . }}-snapshot
                  key: access-key-id
            - name: GOBLIN_SNAPSHOT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "goblin-cluster.fullname" . }}-snapshot
                  key: secret-access-key
            - name: GOBLIN_SNAPSHOT_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ include "goblin-cluster.fullname" . }}-snapshot
                  key: region
            - name: GOBLIN_SNAPSHOT_INTERVAL_SECONDS
              valueFrom:
                secretKeyRef:
                  name: {{ include "goblin-cluster.fullname" . }}-snapshot
                  key: interval-seconds
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/goblin
            - name: bundle
              mountPath: /etc/goblin/tls
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: bundle
          secret:
            secretName: {{ include "goblin-cluster.fullname" . }}-bundle
            defaultMode: 0400
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
