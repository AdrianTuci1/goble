name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      worker_targets:
        description: 'Worker targets (comma separated)'
        required: false
        default: 'x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu'
        type: string
      channel:
        description: 'Update channel written to channel_versions.json'
        required: false
        default: 'stable'
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean
      allow_unsigned:
        description: 'Build unsigned (test builds only; a real release must be signed)'
        required: false
        default: false
        type: boolean

# Minimal by default; only the job that creates the GitHub release asks for
# `contents: write`. Downloading/uploading workflow artifacts does not.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(format('[{0}]', inputs.worker_targets)) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # vendor/alacritty_terminal is a path dependency of goble-terminal, and a
      # missing path dependency fails every cargo command in this workspace, not
      # just the terminal's. Restore it before anything builds; the script pins
      # the archive by SHA-256.
      - name: Restore the vendored terminal emulator
        if: ${{ !hashFiles('vendor/alacritty_terminal/Cargo.toml') }}
        shell: bash
        run: ./scripts/fetch-alacritty-terminal.sh --install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install cross compile dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build worker
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p goblin-worker --release --target ${{ matrix.target }}

      - name: Package worker
        run: |
          mkdir -p dist
          ARCH_NAME=$(echo "${{ matrix.target }}" | tr '-' '_')
          tar -czf "dist/goblin-worker-${ARCH_NAME}.tar.gz" \
            -C "target/${{ matrix.target }}/release" \
            goblin \
            -C "$GITHUB_WORKSPACE" \
            scripts/install-goblin.sh

      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: goblin-worker-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Native desktop app (goble-app). Each runner builds for its own target and
  # runs the matching packaging script, then uploads the installers plus a
  # per-platform SHA256SUMS.
  # ---------------------------------------------------------------------------
  build-app:
    name: app / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macOS aarch64
            platform: macos
            arch: arm64
          # macos-14 is arm64 hardware; cross-building the x86_64 slice there is
          # fine. Swap to macos-13 if a native Intel runner is ever required.
          - os: macos-14
            target: x86_64-apple-darwin
            label: macOS x86_64
            platform: macos
            arch: x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64
            platform: linux
            arch: x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: Windows x86_64
            platform: windows
            arch: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # vendor/alacritty_terminal is a path dependency of goble-terminal, and a
      # missing path dependency fails every cargo command in this workspace, not
      # just the terminal's. Restore it before anything builds; the script pins
      # the archive by SHA-256.
      - name: Restore the vendored terminal emulator
        if: ${{ !hashFiles('vendor/alacritty_terminal/Cargo.toml') }}
        shell: bash
        run: ./scripts/fetch-alacritty-terminal.sh --install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Resolve version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          echo "GOBLE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # --- Linux build prerequisites -----------------------------------------
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev \
            libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev libfreetype-dev \
            file wget libfuse2

      - name: Install appimagetool
        if: matrix.platform == 'linux'
        run: |
          sudo wget -q -O /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          # GitHub runners have no FUSE device; make appimagetool extract itself.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Build app
        # Baked in with `option_env!`: the channel decides whether the build
        # reports crashes and accepts updates, and the version is what a crash
        # report and an update check compare against.
        env:
          GOBLE_CHANNEL: ${{ inputs.channel }}
          GOBLE_RELEASE_VERSION: ${{ env.GOBLE_VERSION }}
        run: cargo build --release -p goble-app --target ${{ matrix.target }}

      # --- macOS --------------------------------------------------------------
      - name: Import Apple signing certificate
        if: matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/goble-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Assemble .app and .dmg
        if: matrix.platform == 'macos'
        env:
          # Only advertise an identity when the certificate was imported above.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # A release is signed; without the secrets above this fails here
          # rather than publishing a download Gatekeeper refuses.
          GOBLE_REQUIRE_SIGNING: ${{ !inputs.allow_unsigned && '1' || '0' }}
        run: |
          packaging/macos/make-bundle.sh \
            --binary "target/${{ matrix.target }}/release/goble-app" \
            --outdir dist --version "$GOBLE_VERSION" --arch ${{ matrix.arch }}
          packaging/macos/make-dmg.sh \
            --app "dist/Goble.app" --outdir dist \
            --version "$GOBLE_VERSION" --arch ${{ matrix.arch }}

      - name: Delete signing keychain
        if: always() && matrix.platform == 'macos'
        run: |
          security delete-keychain "$RUNNER_TEMP/goble-signing.keychain-db" 2>/dev/null || true

      # --- Linux --------------------------------------------------------------
      - name: Build AppImage
        if: matrix.platform == 'linux'
        run: |
          packaging/linux/make-appimage.sh \
            --binary "target/${{ matrix.target }}/release/goble-app" \
            --outdir dist --version "$GOBLE_VERSION" --arch x86_64

      - name: Build .deb and .tar.gz
        if: matrix.platform == 'linux'
        run: |
          packaging/linux/make-deb.sh \
            --binary "target/${{ matrix.target }}/release/goble-app" \
            --outdir dist --version "$GOBLE_VERSION" --arch amd64
          packaging/linux/make-tarball.sh \
            --binary "target/${{ matrix.target }}/release/goble-app" \
            --outdir dist --version "$GOBLE_VERSION" --arch x86_64

      # --- Windows ------------------------------------------------------------
      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        run: choco install innosetup --version=6.3.3 -y --no-progress

      - name: Build installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_PFX: ${{ secrets.WINDOWS_SIGN_CERT_PFX }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
          WINDOWS_SIGN_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_CERT_THUMBPRINT }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
          # A release is signed; without a certificate this fails here rather
          # than publishing an installer SmartScreen flags.
          GOBLE_REQUIRE_SIGNING: ${{ !inputs.allow_unsigned && '1' || '0' }}
        run: |
          ./packaging/windows/build-installer.ps1 `
            -Version "$env:GOBLE_VERSION" `
            -SourceBinary "target/${{ matrix.target }}/release/goble-app.exe" `
            -OutDir dist -Arch x64

      # --- checksums + upload -------------------------------------------------
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          scripts/release.sh --skip-build --skip-package \
            --version "$GOBLE_VERSION" --outdir dist

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goble-app-${{ matrix.target }}
          # Explicit list: dist/* would also pull in the intermediate Goble.app
          # directory, which is not a shippable artifact and would collide when
          # the per-OS artifacts are merged.
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Merge every platform's artifacts, write the aggregate SHA256SUMS and the
  # updater manifest, and sign the manifest when the key is configured.
  # ---------------------------------------------------------------------------
  app-manifest:
    name: app / manifest
    runs-on: ubuntu-22.04
    needs: build-app
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          echo "GOBLE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download app artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: goble-app-*
          merge-multiple: true
          path: dist

      - name: List collected artifacts
        run: ls -lh dist

      - name: Write SHA256SUMS and channel manifest
        env:
          GOBLE_UPDATE_SIGNING_KEY: ${{ secrets.GOBLE_UPDATE_SIGNING_KEY }}
          # The manifest signature is what authenticates every platform's
          # artifact — including Linux, which has no artifact signature of its
          # own — so a release must not ship one unsigned.
          GOBLE_REQUIRE_SIGNING: ${{ !inputs.allow_unsigned && '1' || '0' }}
        run: |
          scripts/release.sh --skip-build --skip-package --manifest \
            --version "$GOBLE_VERSION" \
            --channel "${{ inputs.channel }}" \
            --outdir dist

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: goble-app-manifest
          path: |
            dist/SHA256SUMS
            dist/channel_versions.json
            dist/*.sig
          if-no-files-found: error
          retention-days: 14

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-worker, build-app, app-manifest]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # vendor/alacritty_terminal is a path dependency of goble-terminal, and a
      # missing path dependency fails every cargo command in this workspace, not
      # just the terminal's. Restore it before anything builds; the script pins
      # the archive by SHA-256.
      - name: Restore the vendored terminal emulator
        if: ${{ !hashFiles('vendor/alacritty_terminal/Cargo.toml') }}
        shell: bash
        run: ./scripts/fetch-alacritty-terminal.sh --install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Verify workspace
        run: |
          ./scripts/fmt.sh --check
          cargo check --workspace --all-targets
          cargo test --workspace

      - name: Download worker artifacts
        uses: actions/download-artifact@v4
        with:
          path: worker-artifacts
          pattern: goblin-worker-*

      - name: Download app artifacts
        uses: actions/download-artifact@v4
        with:
          path: app-artifacts
          pattern: goble-app-*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=""
          for f in worker-artifacts/*/*.tar.gz; do
            FILES="$FILES $f"
          done
          for f in app-artifacts/*/*; do
            [ -f "$f" ] || continue
            # Every build-app job uploads its own SHA256SUMS; only the aggregate
            # one from app-manifest belongs on the release, otherwise the upload
            # collides on duplicate asset names.
            case "$f" in
              */SHA256SUMS)
                [ "$(basename "$(dirname "$f")")" = "goble-app-manifest" ] || continue
                ;;
            esac
            FILES="$FILES $f"
          done
          gh release create "${{ inputs.tag }}" \
            --title "Goble ${{ inputs.tag }}" \
            --generate-notes \
            ${{ inputs.draft && '--draft' || '' }} \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            $FILES
