[package]
name = "goble-web"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.86"
description = "Browser terminal client for the Goble gateway."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
vt100 = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "Clipboard",
  "ClipboardEvent",
  "CloseEvent",
  "CompositionEvent",
  "DataTransfer",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Location",
  "MessageEvent",
  "MouseEvent",
  "Navigator",
  "Node",
  "Performance",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "RequestMode",
  "ResizeObserver",
  "Response",
  "TextMetrics",
  "WebSocket",
  "WheelEvent",
  "Window",
  "console",
] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
