[package]
name = "goble-pty"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish.workspace = true
description = "Attachable PTY daemon: a Unix-socket session server, a newline-delimited JSON protocol, and a client that can start it."

[dependencies]
portable-pty = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "goble-pty-daemon"
path = "src/bin/goble-pty-daemon.rs"
