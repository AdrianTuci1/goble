[package]
name = "goble-ui"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
derivative = "2.2"
derive_more = { version = "0.99", features = ["deref", "deref_mut", "from", "into"] }
euclid = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
num-derive = "0.4"
num-traits = "0.2"
ordered-float = "3.0"
palette = "0.7"
parking_lot = "0.12"
resvg = "0.47"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
smallvec = "1.13"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread"] }
wgpu = { version = "25.0", default-features = false, features = ["metal", "wgsl"] }
winit = { version = "0.30", features = ["rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-text = "21.0"
font-kit = { version = "0.13", default-features = false, features = ["source"] }
objc = "0.2"

[dev-dependencies]
anyhow = "1.0"
