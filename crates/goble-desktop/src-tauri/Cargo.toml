[package]
name = "goble-desktop-tauri"
version = "0.1.0"
description = "Goble desktop app built with Tauri"
authors = ["Goble Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.86"

[lib]
name = "goble_desktop_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "goble-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
parking_lot = "0.12"
tokio-tungstenite = "0.26"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
futures = "0.3"
tempfile = "3"
goble-core = { path = "../../goble-core" }

[dev-dependencies]
tokio-test = "0.4"

[lints.rust]
unsafe_code = "forbid"
