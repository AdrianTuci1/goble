name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      worker_targets:
        description: 'Worker targets (comma separated)'
        required: false
        default: 'x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu'
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-worker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(format('[{0}]', inputs.worker_targets)) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install cross compile dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build worker
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p goblin-worker --release --target ${{ matrix.target }}

      - name: Package worker
        run: |
          mkdir -p dist
          ARCH_NAME=$(echo "${{ matrix.target }}" | tr '-' '_')
          tar -czf "dist/goblin-worker-${ARCH_NAME}.tar.gz" \
            -C "target/${{ matrix.target }}/release" \
            goblin \
            -C "$GITHUB_WORKSPACE" \
            scripts/install-goblin.sh

      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: goblin-worker-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-release:
    runs-on: ubuntu-latest
    needs: build-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Verify workspace
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test --workspace

      - name: Download worker artifacts
        uses: actions/download-artifact@v4
        with:
          path: worker-artifacts
          pattern: goblin-worker-*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=""
          for f in worker-artifacts/*/*.tar.gz; do
            FILES="$FILES $f"
          done
          gh release create "${{ inputs.tag }}" \
            --title "Goble ${{ inputs.tag }}" \
            --generate-notes \
            ${{ inputs.draft && '--draft' || '' }} \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            $FILES
