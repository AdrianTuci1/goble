# Default values for goblin-cluster.

replicas: 3

image:
  repository: goble/goblin
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8787
  # Keep WebSocket/agent runs bound to the same pod while the source IP is stable.
  sessionAffinity: ClientIP
  sessionAffinityTimeoutSeconds: 10800

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

# Cluster identity and worker mTLS bundle. The bundle is generated by the desktop
# during provisioning and must be base64-encoded JSON.
workerBundle: ""

# Cluster symmetric key used for snapshot encryption. Must be a URL-safe base64
# 32-byte seed exported from the Goble identity wallet.
clusterKey: ""

snapshot:
  enabled: false
  # Provider: local (for shared PVC/NAS), s3, r2, b2, minio
  provider: local
  # Endpoint for S3-compatible providers (e.g. https://<account>.r2.cloudflarestorage.com)
  endpoint: ""
  bucket: ""
  prefix: "goblin-cluster"
  accessKeyId: ""
  secretAccessKey: ""
  region: ""
  intervalSeconds: 3600

leaseName: goblin-scheduler

# Extra environment variables passed to every pod.
extraEnv: []

# Pod annotations for Prometheus scraping or other tooling.
podAnnotations: {}

# Node selector, tolerations and affinity for GPU or dedicated nodes.
nodeSelector: {}
tolerations: []
affinity: {}

# PodSecurityContext / SecurityContext. Distroless image runs as non-root.
podSecurityContext:
  fsGroup: 65532

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  annotations: {}

rbac:
  create: true
