[package]
name = "goble-app"
version = "0.1.0"
edition = "2021"

[features]
# Composes the remote WebSocket daemon-client codec. The daemon seam (local
# embedded) is always available; this feature readies the remote transport.
daemon = ["goble-daemon-client/remote"]

[dependencies]
goble-ui = { path = "../crates/goble-ui" }
goble-core = { path = "../crates/goble-core" }
goble-desktop-service = { path = "../crates/goble-desktop-service" }
goble-daemon-client = { path = "../crates/goble-daemon-client" }
goble-daemon-protocol = { path = "../crates/goble-daemon-protocol" }
goble-harness-types = { path = "../crates/goble-harness-types" }
goble-harness-cli = { path = "../crates/goble-harness-cli" }
# The control protocol served on a Unix socket: the CLI/MCP surface (F3b) and
# this app's control server share these typed verbs.
goble-control = { path = "../crates/goble-control" }
goble-persistence = { path = "../crates/goble-persistence" }
# The VT terminal core (screen, key/mouse encoding, hooks, palette) that the
# terminal pane drives; see `src/emulator.rs` and `src/terminal.rs`.
goble-terminal = { path = "../crates/goble-terminal" }
# Crash reporting, and the update check. Both are best effort: neither may stop
# the app from starting.
goble-telemetry = { path = "../crates/goble-telemetry" }
goble-update = { path = "../crates/goble-update" }

serde = { workspace = true }
serde_json = { workspace = true }

wgpu = { version = "25.0", default-features = false, features = ["wgsl", "metal", "dx12", "vulkan", "gles"] }
winit = { version = "0.30", features = ["rwh_06"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time"] }
# The attachable PTY daemon: a terminal pane asks it for a session and reads
# `output` events, so the shell survives the app and a pane can reattach.
goble-pty = { path = "../crates/goble-pty" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The sidebar's global search: ripgrep when the machine has one, and the same
# walk in-process when it does not (see `src/ui/global_search.rs`).
walkdir = "2"
anyhow = "1.0"
async-trait = { workspace = true }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# Integration tests spin up an in-memory sqlite store + a temp thread-store dir.
tempfile = "3"
# The work-overlay kill test registers a recording harness whose `cancel` the
# test observes, so the cancel path is proven rather than assumed.
futures = { workspace = true }
goble-harness-runtime = { path = "../crates/goble-harness-runtime" }

[[test]]
name = "chat_flow"
path = "src/integration_testing/chat_flow.rs"

[[test]]
name = "cron_flow"
path = "src/integration_testing/cron_flow.rs"

[[test]]
name = "vault_flow"
path = "src/integration_testing/vault_flow.rs"

[[test]]
name = "connector_flow"
path = "src/integration_testing/connector_flow.rs"

[[test]]
name = "ui_render"
path = "src/integration_testing/ui_render.rs"

[[test]]
name = "first_run_flow"
path = "src/integration_testing/first_run_flow.rs"

[[test]]
name = "harness_flow"
path = "src/integration_testing/harness_flow.rs"

[[test]]
name = "projects_flow"
path = "src/integration_testing/projects_flow.rs"

[[test]]
name = "harness_pages_flow"
path = "src/integration_testing/harness_pages_flow.rs"

[[test]]
name = "menu_flow"
path = "src/integration_testing/menu_flow.rs"
