# Cloudflare Worker for Goble's download endpoints.
#
#   npx wrangler deploy            # from this directory
#   npx wrangler dev               # local worker with emulated KV

name = "goble-downloads"
main = "src/index.mjs"
compatibility_date = "2025-01-01"
workers_dev = true

# Manifests are stored one key per channel: `manifest:stable`, `manifest:beta`,
# `manifest:dev`. Create the namespace once and paste the id below:
#   npx wrangler kv namespace create MANIFESTS
[[kv_namespaces]]
binding = "MANIFESTS"
id = "00000000000000000000000000000000" # placeholder: fill from the command above

[vars]
# Absolute base the Worker advertises in its index links. Keep it in sync with
# the route below when the domain moves.
PUBLIC_BASE_URL = "https://downloads.goble.dev"
# Placeholder owner/repo: replace with the repository that publishes the
# release assets (`GET /dl/:tag/:asset` redirects into its releases).
GITHUB_REPO = "goble-dev/goble"

# Custom domain for the release host. Uncomment at release time, together with
# PUBLIC_BASE_URL, then redeploy and republish the manifests.
# [[routes]]
# pattern = "downloads.goble.dev"
# custom_domain = true

# ADMIN_TOKEN is a secret and never appears in this file. Set it with:
#   npx wrangler secret put ADMIN_TOKEN
