name: Worker Image

# The container remote agents run in: `[remote_agents.<name>] image` in
# `~/.goble/config.toml`. `release.yml` publishes the `goblin` binary as a
# tarball for hosts that install it; this workflow publishes the image the
# sandbox providers pull, because until it exists a `provider = "modal"` (or
# `"docker"`, `"e2b"`, …) table has nothing to deploy.
#
# `main` keeps `main` and `latest` fresh while the image is being shaped, a `v*`
# tag adds the semver tags a release names, and a dispatch builds the current ref
# without a semver tag — the way to exercise a change before tagging it.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Minimal by default; only the job that pushes to the registry asks for
# `packages: write`.
permissions:
  contents: read

env:
  WORKER_IMAGE: goble-worker

jobs:
  worker-image:
    name: worker image / linux/amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # vendor/alacritty_terminal is a path dependency of goble-terminal, and a
      # missing path dependency fails every cargo command in this workspace, not
      # just the terminal's — the Dockerfile copies the tree and builds there.
      # The script pins the archive by SHA-256.
      - name: Restore the vendored terminal emulator
        if: ${{ !hashFiles('vendor/alacritty_terminal/Cargo.toml') }}
        shell: bash
        run: ./scripts/fetch-alacritty-terminal.sh --install

      # ghcr rejects an uppercase path component and `github.repository_owner`
      # keeps the account's own casing, so the name is lowercased once here and
      # every later step reads the output instead of rebuilding it.
      - name: Resolve the image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${WORKER_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Goble worker
            org.opencontainers.image.description=The goblin worker a remote agent runs in

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker/Dockerfile
          # linux/amd64 only. The release workflow cross-compiles the aarch64
          # worker with a cross linker; here the compile would run under QEMU,
          # which multiplies the job's minutes for an image no provider asks for
          # yet. Add `linux/arm64` here once one does, and expect the build to
          # take several times longer.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry caching, in this package under a tag nothing pulls. The
          # build stage copies the whole tree and the repository does not track
          # a lock file, so a new commit is a cache miss and recompiles the
          # dependency graph; what the cache saves is a re-run of the same commit
          # and every build layer under the copy.
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
