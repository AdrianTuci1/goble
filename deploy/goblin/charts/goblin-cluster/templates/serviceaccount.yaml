apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "goblin-cluster.serviceAccountName" . }}
  labels:
    {{- include "goblin-cluster.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "goblin-cluster.fullname" . }}-leader
  labels:
    {{- include "goblin-cluster.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "goblin-cluster.fullname" . }}-leader
  labels:
    {{- include "goblin-cluster.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "goblin-cluster.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "goblin-cluster.fullname" . }}-leader
{{- end }}
