name: Bug report
description: Something behaves differently from what the UI or the docs say.
title: "fix: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here. Use the private advisory form in
        [SECURITY.md](https://github.com/AdrianTuci1/goble/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The behavior you saw, and the one you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest path from a fresh app to the bug.
      placeholder: |
        1. Open ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Goble version
      description: The version in Settings, About, or the release tag you installed.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: |
        A screenshot of the pane, or the relevant lines from the app log. Remove
        API keys, tokens and personal paths first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for the same bug.
          required: true
        - label: I am on the latest release or a build from `main`.
          required: true
