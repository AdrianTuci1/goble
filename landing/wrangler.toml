# The landing at octomus.dev, served by Cloudflare Workers static assets.
# `npm run build` writes ./dist and `npx wrangler deploy` publishes it; the
# octomus.dev custom domain is attached to this Worker in the dashboard.
name = "octomus"
compatibility_date = "2025-06-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
