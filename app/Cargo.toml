[package]
name = "goble-app"
version = "0.1.0"
edition = "2021"

[features]
default = []
hot-reload = ["dep:hot-lib-reloader"]

[dependencies]
goble-ui = { path = "../crates/goble-ui" }
goble-ui-hot = { path = "../crates/goble-ui-hot" }
goble-core = { path = "../crates/goble-core" }

hot-lib-reloader = { version = "0.7", optional = true }

wgpu = { version = "25.0", default-features = false, features = ["wgsl", "metal", "dx12", "vulkan", "gles"] }
winit = { version = "0.30", features = ["rwh_06"] }
tokio = { version = "1.43", features = ["rt-multi-thread"] }
anyhow = "1.0"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
