[package]
name = "goble-desktop"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "goble"
path = "src/main.rs"

[dependencies]
goble-core = { path = "../goble-core" }
