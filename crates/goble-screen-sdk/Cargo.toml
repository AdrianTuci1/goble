[package]
name = "goble-screen-sdk"
version = "0.1.0"
edition = "2021"
description = "Remote screen source SDK: an IronRDP-backed capturer+controller for a real remote desktop (xrdp / RDP), plus a connection factory."

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
goble-screen-core = { path = "../goble-screen-core" }

# The real RDP client stack is heavy and only needed when a remote desktop is
# actually streamed. It is gated behind the `rdp` feature so the common build
# (and every workspace-wide `cargo check`) stays light.
[features]
default = []
# Real RDP decode + remote input, provided by the IronRDP client engine.
rdp = [
    "dep:ironrdp-client",
    "dep:ironrdp-input",
    "dep:ironrdp-pdu",
    "dep:smallvec",
    "dep:tokio",
    "ironrdp-client/rustls",
]

[dependencies.ironrdp-client]
version = "0.1.0"
optional = true
default-features = false

[dependencies.ironrdp-input]
version = "0.7.0"
optional = true

[dependencies.ironrdp-pdu]
version = "0.9.0"
optional = true

[dependencies.smallvec]
version = "1"
optional = true

[dependencies.tokio]
version = "1"
optional = true
features = ["full"]
